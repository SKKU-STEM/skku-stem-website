# Sveltia/Decap CMS 컬렉션 매핑 — 9개는 src/content.config.ts의 zod 스키마와 1:1 정렬,
# 'home'(히어로 슬라이드)는 src/pages/index.astro가 직접 import하는 데이터 파일이다.
# enum 값·required·필드명을 어기면 Astro 빌드가 실패하므로 변경 시 양쪽을 함께 수정.

backend:
  name: github
  repo: SKKU-STEM/skku-stem-website
  branch: main
  base_url: https://skkustem.org
  auth_endpoint: oauth/auth

publish_mode: simple

site_url: https://skkustem.org
display_url: https://skkustem.org
logo_url: https://skkustem.org/logo.png

media_folder: public/uploads
public_folder: /uploads

# ─────────────────────────────────────────────────────────────
# 공통 부분 정의 — 4개 publications 항목 위젯에서 재사용.
# YAML anchor를 사용해 enum/한정어를 한 곳에서 관리.
# ─────────────────────────────────────────────────────────────

collections:
  # ===== Home: 히어로 슬라이드쇼 + Research highlights 카드 (file collection) =====
  - name: home
    label: 'Home'
    files:
      - file: src/content/home/hero.json
        name: hero
        label: 'Hero slideshow (최대 3장)'
        fields:
          - name: items
            label: Slides
            label_singular: Slide
            widget: list
            min: 1
            max: 3
            summary: '{{fields.alt}}'
            fields:
              - name: image
                label: Photo
                widget: image
                media_folder: '/src/assets/hero'
                public_folder: '/hero'
                choose_url: false
                hint: 'src/assets/hero/에 업로드되며 경로는 /hero/<filename>으로 저장된다. 4:3 비율, 1600×1200px 이상 권장 (첫 장이 LCP 이미지).'
              - { name: alt, label: Alt text (스크린리더/SEO), widget: string }
              - { name: caption, label: Caption (사진 아래 작은 설명, 선택), widget: string, required: false }

      - file: src/content/home/research-featured.json
        name: research-featured
        label: 'Research highlights (홈 카드 2장)'
        fields:
          - name: items
            label: Cards
            label_singular: Card
            widget: list
            min: 1
            max: 2
            summary: '{{fields.title}}'
            fields:
              - { name: eyebrow, label: Eyebrow (저널·연도 등 작은 라벨), widget: string, required: false }
              - { name: title, label: Title (클릭 시 아래 Link로 이동), widget: text }
              - { name: summary, label: Summary (한두 문장), widget: text, required: false }
              - { name: link, label: Link URL (제목 클릭 대상), widget: string, hint: '논문 DOI·보도자료·영상 등 대표 링크' }
              - name: media
                label: Media (이미지/GIF 최대 3장 또는 YouTube)
                label_singular: Media item
                widget: list
                required: false
                max: 3
                summary: '{{fields.alt}}'
                hint: '1개면 단일 표시, 2~3개면 캐러셀로 슬라이드된다.'
                fields:
                  - name: image
                    label: Image / GIF
                    widget: image
                    required: false
                    media_folder: '/public/research-featured'
                    public_folder: '/research-featured'
                    choose_url: false
                    hint: 'public/research-featured/에 업로드되며 경로는 /research-featured/<filename>으로 저장된다. GIF도 원본 그대로 재생. YouTube를 쓰면 이미지는 비워둔다.'
                  - { name: youtube, label: YouTube URL, widget: string, required: false, hint: 'https://youtu.be/... 또는 watch?v=... — 입력하면 이 슬라이드는 이미지 대신 동영상으로 재생된다.' }
                  - { name: alt, label: Alt text (이미지 설명), widget: string, required: false }

  # ===== Publications: SKKU 시기 SCI 논문 (file: items 배열) =====
  - name: publications-skku
    label: 'Publications · SKKU SCI'
    files:
      - file: src/content/publications/skku.json
        name: data
        label: 'SKKU SCI papers'
        fields:
          - name: items
            label: Entries
            label_singular: Entry
            widget: list
            summary: '#{{fields.number}} ({{fields.year}}) — {{fields.title}}'
            fields:
              - { name: id, label: ID (number 동일하게), widget: string }
              - { name: number, label: Number, widget: number, value_type: int }
              - { name: year, label: Year, widget: number, value_type: int }
              - { name: lead, label: Lead author group?, widget: boolean, default: false }
              - { name: authors, label: Authors, widget: text }
              - { name: title, label: Title, widget: text }
              - { name: journal, label: Journal, widget: string }
              - { name: volumePages, label: Volume / pages, widget: string, required: false }
              - { name: doi, label: DOI URL, widget: string, required: false, hint: 'https://doi.org/...' }

  # ===== Publications: Pre-SKKU 시기 SCI 논문 =====
  - name: publications-before-skku
    label: 'Publications · Pre-SKKU SCI'
    files:
      - file: src/content/publications/before-skku.json
        name: data
        label: 'Pre-SKKU SCI papers'
        fields:
          - name: items
            label: Entries
            label_singular: Entry
            widget: list
            summary: '#{{fields.number}} ({{fields.year}}) — {{fields.title}}'
            fields:
              - { name: id, label: ID (number 동일하게), widget: string }
              - { name: number, label: Number, widget: number, value_type: int }
              - { name: year, label: Year, widget: number, value_type: int }
              - { name: lead, label: Lead author group?, widget: boolean, default: false }
              - { name: authors, label: Authors, widget: text }
              - { name: title, label: Title, widget: text }
              - { name: journal, label: Journal, widget: string }
              - { name: volumePages, label: Volume / pages, widget: string, required: false }
              - { name: doi, label: DOI URL, widget: string, required: false }

  # ===== Publications: Non-SCI / 특허 / 단행본 =====
  - name: publications-non-sci-patents
    label: 'Publications · Non-SCI / Patents / Books'
    files:
      - file: src/content/publications/non-sci-patents.json
        name: data
        label: 'Non-SCI / Patents / Books'
        fields:
          - name: items
            label: Entries
            label_singular: Entry
            widget: list
            summary: '#{{fields.number}} [{{fields.kind}}] {{fields.title}}'
            fields:
              - { name: id, label: ID (number 동일하게), widget: string }
              - { name: number, label: Number, widget: number, value_type: int }
              - { name: year, label: Year, widget: number, value_type: int }
              - name: kind
                label: Kind
                widget: select
                options: [non-sci, patent, book]
              - { name: title, label: Title (KR or EN), widget: text }
              - { name: titleEn, label: Title (EN, optional duplicate), widget: text, required: false }
              - { name: link, label: Link URL, widget: string, required: false }
              # patent 전용
              - name: region
                label: Patent region
                widget: select
                options: [Korea, USA]
                required: false
              - { name: inventors, label: Inventors (patent), widget: text, required: false }
              - { name: patentNo, label: Patent No.,         widget: string, required: false }
              - { name: applicationNo, label: Application No.,   widget: string, required: false }
              - { name: applicationDate, label: Application date, widget: string, required: false }
              - { name: registrationNo, label: Registration No.,  widget: string, required: false }
              - { name: registrationDate, label: Registration date, widget: string, required: false }
              - name: status
                label: Patent status
                widget: select
                options: [Granted, Applied]
                required: false
              # non-sci / book 전용
              - { name: authors, label: Authors (non-sci/book), widget: text, required: false }
              - { name: journal, label: Journal (non-sci),  widget: string, required: false }
              - { name: volumePages, label: Volume / pages (non-sci), widget: string, required: false }
              - { name: publisher, label: Publisher (book), widget: string, required: false }
              - { name: isbn, label: ISBN (book), widget: string, required: false }
              - { name: publicationDate, label: Publication date (book), widget: string, required: false }

  # ===== Publications: PI Selected (CV 페이지 노출용) =====
  - name: publications-pi-selected
    label: 'Publications · PI Selected'
    files:
      - file: src/content/publications/pi-selected.json
        name: data
        label: 'PI selected publications'
        fields:
          - name: items
            label: Entries
            label_singular: Entry
            widget: list
            summary: '[{{fields.category}} #{{fields.order}}] {{fields.year}} — {{fields.title}}'
            fields:
              - { name: id, label: ID (kebab-case, unique), widget: string }
              - name: category
                label: Category
                widget: select
                options: [microscopy, ai]
              - { name: order, label: Order (작을수록 위), widget: number, value_type: int }
              - { name: year, label: Year, widget: number, value_type: int }
              - { name: authors, label: Authors, widget: text }
              - { name: title, label: Title, widget: text }
              - { name: journal, label: Journal, widget: string }
              - { name: volumePages, label: Volume / pages, widget: string, required: false }
              - { name: doi, label: DOI URL, widget: string, required: false }

  # ===== People · PI 프로필 (CV 본문 — file collection) =====
  # pi.astro의 소개·Education·Experience·Honors·Contact를 편집한다.
  # Selected publications는 위 'Publications · PI Selected' 컬렉션에서 따로 관리.
  - name: pi-profile
    label: 'People · PI 프로필'
    files:
      - file: src/content/pi/profile.json
        name: profile
        label: 'PI 프로필 (CV)'
        fields:
          - { name: nameKo, label: 이름 (KO), widget: string }
          - { name: nameEn, label: Name (EN), widget: string }
          - { name: position, label: '직위 (예: Professor)', widget: string }
          - { name: department, label: 학과, widget: string }
          - { name: university, label: 대학, widget: string }
          - { name: location, label: '위치 (예: Suwon 16419, Republic of Korea)', widget: string }
          - { name: bio, label: 소개 (Bio 단락), widget: text }
          - name: education
            label: Education
            label_singular: 학력 항목
            widget: list
            summary: '{{fields.years}} — {{fields.title}}'
            fields:
              - { name: years, label: '기간 (예: Mar. 2005 – Feb. 2010)', widget: string }
              - { name: title, label: 학위/제목, widget: string }
              - { name: institution, label: 기관, widget: string }
          - name: experience
            label: Research Experience
            label_singular: 경력 항목
            widget: list
            summary: '{{fields.start}} · {{fields.title}}'
            hint: '입력 순서와 무관하게 시작일(Start) 최신순으로 사이트가 자동 정렬한다.'
            fields:
              - name: start
                label: Start (시작 연·월 — 정렬 키)
                widget: datetime
                date_format: 'YYYY-MM'
                time_format: false
                picker_utc: true
                hint: '연도+월만 선택. 이 값으로 최신순 자동 정렬된다(화면에는 아래 기간 라벨이 표시됨).'
              - { name: years, label: '기간 라벨 (화면 표시 — 예: Feb. 2025 – present)', widget: string }
              - { name: title, label: 직위/제목, widget: string }
              - { name: institution, label: 기관, widget: string }
          - name: honors
            label: Honors & Awards
            label_singular: 수상 항목
            widget: list
            summary: '{{fields.year}} — {{fields.title}}'
            hint: '입력 순서와 무관하게 연도 최신순으로 자동 정렬된다(같은 해는 목록에 놓은 순서대로).'
            fields:
              - { name: year, label: 연도, widget: string }
              - { name: title, label: 수상명, widget: string }
              - { name: cert, label: 증서 번호 (선택), widget: string, required: false }
              - { name: url, label: 링크 URL (선택), widget: string, required: false, hint: '있으면 수상명이 링크가 된다.' }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: email, label: Email, widget: string }
              - { name: phone, label: Phone (선택), widget: string, required: false }
              - { name: orcid, label: 'ORCID (숫자만 — 예: 0000-0003-3220-9004)', widget: string, required: false }
              - { name: office, label: Office 주소 (선택, 줄바꿈 가능), widget: text, required: false }

  # ===== News (folder, .md frontmatter-only) =====
  - name: news
    label: News
    label_singular: News post
    folder: src/content/news
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: '{{fields.slug}}'
    identifier_field: headline
    summary: "{{fields.date | date('YYYY')}} · {{headline}}"
    # 목록은 날짜 최신순으로 자동 정렬 — order 필드 없이 date만 채우면 사이트가 알아서 정렬한다.
    sortable_fields:
      fields: [date, headline, category]
      default:
        field: date
        direction: descending
    fields:
      - { name: slug, label: Slug (파일명, kebab-case 권장), widget: string }
      - name: date
        label: Date (달력 선택 — 최신순 자동 정렬에 사용)
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
      - { name: dateLabel, label: Date label (표시용, 선택), widget: string, required: false, hint: '비우면 위 날짜를 "February 10, 2026"처럼 표시. 기간/월만 표기가 필요할 때만 입력 — 예: "June 4–16, 2025", "February 2025".' }
      - name: category
        label: Category
        widget: select
        options: [paper, award, media, member, event, grant, lab]
      - { name: headline, label: Headline, widget: string }
      - { name: summary, label: Summary (본문 단락), widget: text, required: false }
      - name: links
        label: External links
        widget: list
        required: false
        fields:
          - { name: href, label: URL, widget: string }
          - { name: label, label: Label, widget: string }
      - name: media
        label: Media (이미지/GIF 또는 YouTube)
        widget: list
        required: false
        max: 8
        summary: '{{fields.alt}}'
        hint: '1개면 단일 표시, 2개 이상이면 캐러셀로 슬라이드된다.'
        fields:
          - name: image
            label: Image / GIF
            widget: image
            required: false
            media_folder: '/public/news-media'
            public_folder: '/news-media'
            choose_url: false
            hint: 'public/news-media/에 업로드되며 경로는 /news-media/<filename>으로 저장된다. GIF도 원본 그대로 재생. YouTube를 쓰면 이미지는 비워둔다.'
          - { name: youtube, label: YouTube URL, widget: string, required: false, hint: 'https://youtu.be/... 또는 watch?v=... — 입력하면 이 슬라이드는 이미지 대신 동영상으로 재생된다.' }
          - { name: alt, label: Alt text (이미지 설명), widget: string, required: false }
      - { name: featured, label: Featured (Home/News 카드형), widget: boolean, default: false, required: false }

  # ===== Members (folder, .md frontmatter-only, 현 멤버 + Alumni 통합) =====
  - name: members
    label: Members
    label_singular: Member
    folder: src/content/members
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: '{{nameEn}}'
    identifier_field: nameEn
    summary: '[{{section}}] {{nameKo}} ({{nameEn}})'
    # 현 멤버는 입학일(startDate) 오름차순, Alumni는 졸업연도 최신순으로 사이트가 자동 정렬한다.
    sortable_fields:
      fields: [startDate, nameEn, section]
      default:
        field: startDate
        direction: ascending
    fields:
      - name: section
        label: Section
        widget: select
        options: [postdoc, phd, master, undergrad, alumni]
      - name: startDate
        label: 입학 연·월 (현 멤버 — 정렬·연차·기수 자동 계산)
        widget: datetime
        date_format: 'YYYY-MM'
        time_format: false
        picker_utc: true
        required: false
        hint: '현 멤버(Postdoc/Ph.D./Undergrad)만 입력. 입학연도가 1년차이고, 학생은 입학 후 6개월마다 1기씩 늘어난 총 기수가 카드에 자동 표시된다. Alumni는 비우고 Role의 종료연도로 정렬된다.'
      - { name: nameKo, label: Name (KO), widget: string }
      - { name: nameEn, label: Name (EN), widget: string }
      - { name: position, label: Position (현 멤버), widget: string, required: false }
      - { name: program, label: Program (현 멤버), widget: string, required: false, hint: '예: Integrated course / Ph.D. course / MS course' }
      - { name: industry, label: 산학 (산학협력 학생), widget: boolean, required: false, default: false, hint: '켜면 카드의 연차·기수 배지 옆에 「산학」 배지가 표시된다.' }
      - { name: yearRange, label: Year range (Postdoc 등 종료연도 있는 경우만), widget: string, required: false, hint: '예: 2020–2026. 학생은 비우면 startDate에서 "입학연도–present"가 자동 표시된다.' }
      - { name: email, label: Email, widget: string, required: false }
      - { name: orcid, label: ORCID, widget: string, required: false }
      - { name: kri, label: KRI ID, widget: string, required: false }
      - { name: coAdvisor, label: Co-advisor, widget: string, required: false }
      - name: photoPath
        label: Photo
        widget: image
        required: false
        hint: 'src/assets/members/<INIT>.jpg에 업로드되며 frontmatter path는 /members/<INIT>.jpg로 들어간다 (PortraitBox가 basename으로 lookup해 Astro Image로 webp 변환).'
        media_folder: '/src/assets/members'
        public_folder: '/members'
        choose_url: false
      # Alumni 전용
      - { name: role, label: 'Role (alumni)', widget: string, required: false, hint: '예: Ph.D. (2018–2024)' }
      - { name: currentAffiliation, label: Current affiliation (alumni), widget: string, required: false }

  # ===== Research Themes (folder, .md frontmatter-only) =====
  - name: research-themes
    label: Research Themes
    label_singular: Theme
    folder: src/content/research-themes
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: '{{fields.order}}-{{fields.slug}}'
    identifier_field: title
    summary: '[#{{order}}] {{title}}'
    fields:
      - { name: order, label: Order (1..N, 위에서 아래 순), widget: number, value_type: int }
      - { name: slug, label: Slug (URL/파일명용 영문 ID), widget: string }
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle (한 줄 부제), widget: string }
      - { name: summary, label: Summary (2~4 문장), widget: text }
      - name: relatedHighlights
        label: Related highlights (slug 목록)
        widget: list
        hint: 'src/content/research-highlights/ 의 파일명에서 .md 빼고 입력. 새 paper 자동 분류는 src/utils/themeClassifier.ts 키워드/override 기반.'
      - name: image
        label: Figure
        widget: image
        required: false
        media_folder: '/public/research'
        public_folder: '/research'
        choose_url: false
      - { name: imageAlt, label: Figure alt text, widget: string, required: false }

  # ===== Research Highlights (folder, .md frontmatter-only) =====
  - name: research-highlights
    label: Research Highlights
    label_singular: Highlight
    folder: src/content/research-highlights
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: "{{fields.date | date('YYYY')}}-{{title}}"
    identifier_field: title
    summary: "{{fields.date | date('YYYY')}} · {{title}}"
    # 타임라인은 발행 날짜 최신순으로 자동 정렬 — order 없이 date만 채우면 된다.
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    fields:
      - name: date
        label: Date (발행 연·월 — 최신순 자동 정렬)
        widget: datetime
        date_format: 'YYYY-MM'
        time_format: false
        picker_utc: true
        hint: '연도+월만 입력. 같은 해 안의 순서는 월로 결정된다(월·일은 카드에 표시되지 않음).'
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text }
      - { name: journal, label: Journal, widget: string }
      - { name: volumePages, label: Volume / pages, widget: string }
      - { name: doi, label: DOI URL, widget: string, hint: 'https://doi.org/... 또는 출판사 URL' }
      - { name: codeUrl, label: Code URL, widget: string, required: false }
      - { name: mention, label: Press mention text, widget: string, required: false }
      - { name: mentionUrl, label: Press mention URL, widget: string, required: false }
      - name: image
        label: Figure
        widget: image
        required: false
        media_folder: '/public/research'
        public_folder: '/research'
        choose_url: false
      - { name: imageAlt, label: Figure alt text, widget: string, required: false }

  # ===== Facilities (folder, .md frontmatter-only) =====
  - name: facilities
    label: Facilities
    label_singular: Facility
    folder: src/content/facilities
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: '{{fields.slug}}'
    identifier_field: title
    summary: '[#{{order}}] {{title}}'
    fields:
      - { name: order, label: Order, widget: number, value_type: int }
      - { name: slug, label: Slug (파일명), widget: string }
      - { name: title, label: Title, widget: string }
      - { name: model, label: Model, widget: string }
      - { name: description, label: Description, widget: text }
      - name: highlights
        label: Highlights (불릿)
        widget: list
        required: false
        field: { name: bullet, widget: string, label: Bullet }
      - { name: location, label: Location, widget: string, required: false }
      - { name: photoCount, label: Photo count, widget: number, value_type: int }

  # ===== Gallery Events (folder, .md frontmatter-only) =====
  - name: gallery-events
    label: Gallery Events
    label_singular: Gallery event
    folder: src/content/gallery-events
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: '{{fields.slug}}'
    identifier_field: title
    summary: "{{fields.date | date('YYYY')}} · {{title}}"
    # 목록은 날짜 최신순으로 자동 정렬 — order 필드 없이 date만 채우면 사이트가 알아서 정렬한다.
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    fields:
      - { name: slug, label: Slug (파일명), widget: string }
      - name: date
        label: Date (달력 선택 — 최신순 자동 정렬에 사용)
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
      - { name: dateLabel, label: Date label (표시용, 선택), widget: string, required: false, hint: '비우면 위 날짜를 "February 10, 2026"처럼 표시. 연도/월만 표기나 기간이 필요할 때만 입력 — 예: "2022", "Aug. 2022", "Nov. 3–5, 2021".' }
      - { name: title, label: Title, widget: string }
      - { name: titleEn, label: Title (EN, optional), widget: string, required: false }
      - { name: location, label: Location, widget: string, required: false }
      - { name: participants, label: Participants, widget: string, required: false }
      - { name: awards, label: Awards, widget: string, required: false }
      - name: media
        label: Media (사진/GIF 또는 YouTube)
        widget: list
        required: false
        max: 20
        summary: '{{fields.alt}}'
        hint: '1개면 단일 표시, 2개 이상이면 캐러셀로 슬라이드된다.'
        fields:
          - name: image
            label: Photo / GIF
            widget: image
            required: false
            media_folder: '/public/gallery-media'
            public_folder: '/gallery-media'
            choose_url: false
            hint: 'public/gallery-media/에 업로드되며 경로는 /gallery-media/<filename>으로 저장된다. GIF도 원본 그대로 재생. YouTube를 쓰면 이미지는 비워둔다.'
          - { name: youtube, label: YouTube URL, widget: string, required: false, hint: 'https://youtu.be/... 또는 watch?v=... — 입력하면 이 슬라이드는 동영상으로 재생된다.' }
          - { name: alt, label: Alt text (비우면 행사 제목 사용), widget: string, required: false }
